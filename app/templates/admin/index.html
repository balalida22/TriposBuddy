{% extends 'base.html' %}
{% block title %}Admin — TriposBuddy{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Admin Dashboard</h1>
</div>

<div class="admin-stats">
  <div class="stat-card">
    <div class="stat-number">{{ user_count }}</div>
    <div class="stat-label">Users</div>
    <a href="{{ url_for('admin.users') }}" class="btn btn-secondary btn-sm">Manage</a>
  </div>
  <div class="stat-card">
    <div class="stat-number">{{ group_count }}</div>
    <div class="stat-label">Groups</div>
    <a href="{{ url_for('admin.groups') }}" class="btn btn-secondary btn-sm">Manage</a>
  </div>
  <div class="stat-card">
    <div class="stat-number">{{ active_invites }}</div>
    <div class="stat-label">Active Invites</div>
    <a href="{{ url_for('admin.invites') }}" class="btn btn-secondary btn-sm">Manage</a>
  </div>
</div>

<div class="admin-links">
  <a href="{{ url_for('admin.questions') }}" class="btn btn-secondary">Manage Questions</a>
</div>
{% endblock %}
